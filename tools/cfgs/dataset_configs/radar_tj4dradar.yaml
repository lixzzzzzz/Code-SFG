DATASET: 'KittiDataset'
DATA_PATH: '/home/xiaozhi/data/code_py/openPCDet/OpenPCDet-master/data/TJ4DRadar/TJ4DRadar'
POINT_CLOUD_RANGE: [0, -39.68, -4, 69.12, 39.68, 2]
DATA_SPLIT: {
    'train': train,
    'test': val
}
INFO_PATH: {
    'train': [kitti_infos_train.pkl],
    'test': [kitti_infos_val.pkl],
}

FOV_POINTS_ONLY: True

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder'] 
    AUG_CONFIG_LIST:
        - NAME: random_world_flip   
          ALONG_AXIS_LIST: ['x']

        - NAME: random_world_scaling 
          WORLD_SCALE_RANGE: [0.95, 1.05]
POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'v_r', 'range', 'power', 'alpha', 'beta'],
    src_feature_list: ['x', 'y', 'z', 'v_r', 'range', 'power', 'alpha', 'beta'],
}
DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points   
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels  
      VOXEL_SIZE: [0.16, 0.16, 5]
      MAX_POINTS_PER_VOXEL: 10
      MAX_NUMBER_OF_VOXELS: {
        'train': 16000,
        'test': 40000
      }
